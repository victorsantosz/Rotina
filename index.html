<script>
/* =========================================================
   ATUALIZAÇÕES — CENTRAL DE ESTUDOS
   ========================================================= */

/* ---------- 1. NOTÍCIAS DOS CONCURSOS ---------- */

const NOTICIAS_CONCURSOS = [
  {
    id: "gcm-salvador",
    nome: "GCM Salvador",
    busca: "GCM Salvador concurso edital 2026 2027",
    fonte: "Google Notícias"
  },
  {
    id: "pmba",
    nome: "PMBA",
    busca: "PMBA concurso soldado edital 2026 2027",
    fonte: "Google Notícias"
  },
  {
    id: "pmpe",
    nome: "PMPE",
    busca: "PMPE concurso soldado edital 2026 2027",
    fonte: "Google Notícias"
  },
  {
    id: "transpetro",
    nome: "Transpetro",
    busca: "Transpetro concurso edital 2026 2027",
    fonte: "Google Notícias"
  }
];

function abrirNoticiasConcurso(busca) {
  window.open(
    "https://www.google.com/search?tbm=nws&q=" +
    encodeURIComponent(busca),
    "_blank",
    "noopener,noreferrer"
  );
}

function renderNoticiasConcursos() {
  const el = document.getElementById("sbe-list");
  if (!el) return;

  el.innerHTML = NOTICIAS_CONCURSOS.map(c => {

    const atual =
      typeof CONCURSOS_ACOMPANHADOS !== "undefined"
        ? CONCURSOS_ACOMPANHADOS.find(x => x.id === c.id)
        : null;

    const status =
      atual?.status === "publicado"
        ? "Edital publicado"
        : atual?.status === "inscricoes"
        ? "Inscrições abertas"
        : "Aguardando edital";

    const classe =
      atual?.status === "publicado"
        ? "pub"
        : atual?.status === "inscricoes"
        ? "insc"
        : "pend";

    return `
      <div class="sbe-item sbe-news-item">

        <div class="sbe-dot ${classe}"></div>

        <div class="sbe-news-content">
          <div class="sbe-name">${c.nome}</div>

          <div class="sbe-status">
            ${status}
          </div>

          <button
            class="sbe-news-btn"
            onclick="abrirNoticiasConcurso('${c.busca.replace(/'/g, "\\'")}')"
          >
            📰 Ver notícias
          </button>
        </div>

      </div>
    `;
  }).join("");
}


/* ---------- 2. STATUS DE SINCRONIZAÇÃO ---------- */

function setSyncBadge(status) {

  const badge = document.getElementById("sync-badge");
  const txt = document.getElementById("sync-badge-txt");

  if (!badge || !txt) return;

  if (status === "syncing") {

    txt.textContent = "Sincronizando...";

    badge.classList.remove(
      "sync-ok",
      "sync-error"
    );

    badge.classList.add("sync-loading");

    return;
  }

  if (status === "error") {

    txt.textContent = "Não sincronizado";

    badge.classList.remove(
      "sync-ok",
      "sync-loading"
    );

    badge.classList.add("sync-error");

    return;
  }

  txt.textContent = "Sincronizado";

  badge.classList.remove(
    "sync-loading",
    "sync-error"
  );

  badge.classList.add("sync-ok");
}


/* ---------- 3. BOTÃO ATUALIZAR ---------- */

async function manualSync() {

  setSyncBadge("syncing");

  try {

    if (typeof refreshHistoricoFromCloud === "function") {
      await refreshHistoricoFromCloud(true);
    }

    if (typeof loadStorage === "function") {
      await loadStorage();
    }

    if (typeof updateAll === "function") {
      updateAll();
    }

    if (typeof renderHistorico === "function") {
      renderHistorico();
    }

    if (typeof renderCharts === "function") {
      renderCharts();
    }

    if (typeof renderAtividades === "function") {
      renderAtividades();
    }

    setSyncBadge("ok");

    if (typeof showToast === "function") {
      showToast("☁️", "Dados atualizados!");
    }

  } catch (erro) {

    console.error("Erro ao sincronizar:", erro);

    setSyncBadge("error");

    if (typeof showToast === "function") {
      showToast(
        "⚠️",
        "Não foi possível atualizar os dados."
      );
    }
  }
}


/* ---------- 4. HISTÓRICO — ATUALIZAÇÃO REAL ---------- */

async function atualizarHistoricoCompleto() {

  try {

    if (
      typeof firebaseAvailable !== "undefined" &&
      firebaseAvailable &&
      typeof fbUser !== "undefined" &&
      fbUser &&
      typeof fbDB !== "undefined"
    ) {

      const snap =
        await fbDB
          .collection("victor")
          .doc(fbUser.uid)
          .get();

      if (snap.exists) {

        const dados = snap.data();

        if (dados.historico) {
          historico = dados.historico;
        }

        if (dados.revisoes) {
          revisoes = dados.revisoes;
        }
      }
    }

    if (typeof renderHistorico === "function") {
      renderHistorico();
    }

    if (typeof renderCharts === "function") {
      renderCharts();
    }

  } catch (erro) {

    console.error(
      "Erro ao atualizar histórico:",
      erro
    );
  }
}


/* ---------- 5. GRÁFICOS DE DESEMPENHO ---------- */

function criarGraficoBarras() {

  const container =
    document.getElementById("performance-extra-chart");

  if (!container) return;

  const registros =
    typeof historico !== "undefined"
      ? historico
      : [];

  const dias = {};

  registros.forEach(r => {

    if (!r.date) return;

    if (!dias[r.date]) {
      dias[r.date] = {
        horas: 0,
        questoes: 0,
        acertos: 0,
        erros: 0
      };
    }

    dias[r.date].horas += Number(r.horas) || 0;
    dias[r.date].questoes += Number(r.questoes) || 0;
    dias[r.date].acertos += Number(r.acertos) || 0;
    dias[r.date].erros += Number(r.erros) || 0;
  });

  const lista =
    Object.entries(dias)
      .sort((a,b) => a[0].localeCompare(b[0]))
      .slice(-14);

  if (!lista.length) {

    container.innerHTML =
      `<div class="performance-empty">
        Ainda não existem dados suficientes para o gráfico.
      </div>`;

    return;
  }

  const maxQuestoes =
    Math.max(
      ...lista.map(x => x[1].questoes),
      1
    );

  container.innerHTML = `
    <div class="performance-chart-title">
      📈 Evolução dos últimos dias
    </div>

    <div class="performance-bars">

      ${lista.map(([data, item]) => {

        const altura =
          Math.max(
            6,
            Math.round(
              item.questoes /
              maxQuestoes *
              100
            )
          );

        const partes =
          data.split("-");

        const label =
          `${partes[2]}/${partes[1]}`;

        return `
          <div class="performance-bar-item">

            <div
              class="performance-bar"
              style="height:${altura}%"
              title="${item.questoes} questões"
            >
              <span>
                ${item.questoes || 0}
              </span>
            </div>

            <div class="performance-date">
              ${label}
            </div>

          </div>
        `;

      }).join("")}

    </div>
  `;
}


/* ---------- 6. EXPORTAR EDITAL COM PROGRESSO ---------- */

function exportarEditalComProgresso() {

  if (
    typeof EDITAL === "undefined"
  ) {
    alert("Edital não encontrado.");
    return;
  }

  let total = 0;
  let concluidos = 0;

  let html = `
    <!DOCTYPE html>

    <html lang="pt-BR">

    <head>

      <meta charset="UTF-8">

      <title>
        Edital com Progresso — Victor Santos
      </title>

      <style>

        body {
          font-family: Arial, sans-serif;
          margin: 40px;
          color: #0D134C;
        }

        h1 {
          margin-bottom: 5px;
        }

        h2 {
          margin-top: 30px;
          border-bottom: 2px solid #0D134C;
          padding-bottom: 5px;
        }

        .topico {
          padding: 8px;
          margin: 4px 0;
          border-radius: 6px;
          background: #f1f3f8;
        }

        .feito {
          background: #dcfce7;
          text-decoration: line-through;
        }

        .progresso {
          font-weight: bold;
          margin: 10px 0;
        }

      </style>

    </head>

    <body>

      <h1>
        Missão Farda & Concursos
      </h1>

      <p>
        Edital verticalizado com progresso
      </p>
  `;

  EDITAL.forEach(disc => {

    html += `
      <h2>
        ${disc.nome}
      </h2>
    `;

    disc.grupos.forEach(grupo => {

      html += `
        <h3>
          ${grupo.nome}
        </h3>
      `;

      grupo.topicos.forEach((topico, index) => {

        total++;

        const chave =
          disc.id +
          "_" +
          slug(grupo.nome) +
          "_" +
          index;

        const ts =
          typeof getTS === "function"
            ? getTS(chave)
            : {};

        const feito =
          !!ts.done;

        if (feito) {
          concluidos++;
        }

        html += `
          <div class="topico ${feito ? "feito" : ""}">
            ${feito ? "✓" : "□"}
            ${topico}
          </div>
        `;

      });
    });
  });

  const percentual =
    total
      ? Math.round(
          concluidos /
          total *
          100
        )
      : 0;

  html = html.replace(
    "<p>Ed",
    `
      <div class="progresso">
        Progresso geral:
        ${percentual}%
        (${concluidos}/${total})
      </div>

      <p>Ed`
  );

  html += `
    </body>
    </html>
  `;

  const blob =
    new Blob(
      [html],
      {type:"text/html;charset=utf-8"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "edital-com-progresso.html";

  a.click();

  URL.revokeObjectURL(url);
}


/* ---------- 7. NOVO BOTÃO NO EDITAL ---------- */

function adicionarBotaoExportarEdital() {

  const page =
    document.getElementById(
      "page-edital"
    );

  if (!page) return;

  if (
    document.getElementById(
      "btn-exportar-edital-progresso"
    )
  ) return;

  const botao =
    document.createElement("button");

  botao.id =
    "btn-exportar-edital-progresso";

  botao.className =
    "btn btn-primary";

  botao.innerHTML =
    "📄 Exportar edital com progresso";

  botao.onclick =
    exportarEditalComProgresso;

  const primeiro =
    page.firstElementChild;

  if (primeiro) {
    primeiro.appendChild(botao);
  }
}


/* ---------- 8. INICIALIZAÇÃO ---------- */

function iniciarAtualizacoesCentral() {

  renderNoticiasConcursos();

  adicionarBotaoExportarEdital();

  criarGraficoBarras();

  atualizarHistoricoCompleto();

  setSyncBadge("ok");
}
